suite: workload replicas
templates:
  - templates/workloads/deployment.yml
  - templates/workloads/statefulset.yml
release:
  name: smoke-test
  namespace: default

tests:
  - it: omits Deployment replicas when unset
    template: templates/workloads/deployment.yml
    set:
      deployments.app.containers.main.image: nginx:1.27.5
    asserts:
      - notExists:
          path: spec.replicas

  - it: renders the configured Deployment replicas
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 3
      deployments.app.containers.main.image: nginx:1.27.5
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: honours an explicit Deployment replicas of 0
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 0
      deployments.app.containers.main.image: nginx:1.27.5
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: omits StatefulSet replicas when unset
    template: templates/workloads/statefulset.yml
    set:
      statefulSets.app.containers.main.image: nginx:1.27.5
    asserts:
      - notExists:
          path: spec.replicas

  - it: renders the configured StatefulSet replicas
    template: templates/workloads/statefulset.yml
    set:
      statefulSets.app.replicas: 2
      statefulSets.app.containers.main.image: nginx:1.27.5
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: honours an explicit StatefulSet replicas of 0
    template: templates/workloads/statefulset.yml
    set:
      statefulSets.app.replicas: 0
      statefulSets.app.containers.main.image: nginx:1.27.5
    asserts:
      - equal:
          path: spec.replicas
          value: 0

  - it: omits Deployment replicas when an HPA targets it, even if replicas is set
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 3
      deployments.app.containers.main.image: nginx:1.27.5
      hpas.app.scaleTargetRef.name: app
      hpas.app.targetCPU: 70
    asserts:
      - notExists:
          path: spec.replicas

  - it: keeps Deployment replicas when the HPA targets another workload
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 3
      deployments.app.containers.main.image: nginx:1.27.5
      hpas.other.scaleTargetRef.name: other
      hpas.other.targetCPU: 70
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: keeps Deployment replicas when the targeting HPA is disabled
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 3
      deployments.app.containers.main.image: nginx:1.27.5
      hpas.app.disabled: true
      hpas.app.scaleTargetRef.name: app
      hpas.app.targetCPU: 70
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: keeps Deployment replicas when the HPA targets a StatefulSet with the same name
    template: templates/workloads/deployment.yml
    set:
      deployments.app.replicas: 3
      deployments.app.containers.main.image: nginx:1.27.5
      hpas.app.scaleTargetRef.name: app
      hpas.app.scaleTargetRef.kind: StatefulSet
      hpas.app.targetCPU: 70
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: omits StatefulSet replicas when an HPA targets it, even if replicas is set
    template: templates/workloads/statefulset.yml
    set:
      statefulSets.app.replicas: 2
      statefulSets.app.containers.main.image: nginx:1.27.5
      hpas.app.scaleTargetRef.name: app
      hpas.app.scaleTargetRef.kind: StatefulSet
      hpas.app.targetCPU: 70
    asserts:
      - notExists:
          path: spec.replicas

  - it: keeps StatefulSet replicas when the HPA targets a Deployment with the same name
    template: templates/workloads/statefulset.yml
    set:
      statefulSets.app.replicas: 2
      statefulSets.app.containers.main.image: nginx:1.27.5
      hpas.app.scaleTargetRef.name: app
      hpas.app.targetCPU: 70
    asserts:
      - equal:
          path: spec.replicas
          value: 2
