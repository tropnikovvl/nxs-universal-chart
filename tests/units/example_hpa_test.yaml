suite: example hpa
templates:
  - templates/observability/hpa.yaml
release:
  name: smoke-test
  namespace: default

tests:
  - it: renders the HPA example
    values:
      - ../../values.yaml.example
    documentSelector:
      path: metadata.name
      value: universal-blue-api
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.apiVersion
          value: apps/v1
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: universal-blue-api
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 4
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.type
          value: Utilization
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.behavior.scaleUp.selectPolicy
          value: Max

  - it: omits spec.behavior when the values key is unset
    set:
      hpas:
        api:
          scaleTargetRef:
            name: api
          minReplicas: 2
          maxReplicas: 4
          targetCPU: 70
    documentSelector:
      path: metadata.name
      value: smoke-test-api
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isNull:
          path: spec.behavior
